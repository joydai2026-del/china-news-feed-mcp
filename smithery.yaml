startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - apifyToken
    properties:
      apifyToken:
        type: string
        description: Your Apify API token. Actor usage is billed to your own Apify account.
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/index.js'],
      env: { APIFY_TOKEN: config.apifyToken }
    })
